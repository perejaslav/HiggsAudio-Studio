name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>&1 || echo "[warn] some binary deps may need CUDA (CI is CPU-only)"
      - name: Run tag-filter tests (pure Python, no GPU)
        run: python tests/test_tags.py
